name: Reminder Cron Job

on:
  schedule:
    - cron: '* * * * *' 
  workflow_dispatch:      

jobs:
  send-reminder:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: [18.x, 20.x, 22.x]
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci

    - name: Send reminder to production endpoint
      run: |
        curl -X POST 'https://daily-check-in.com.ng/api/cron/test'
      continue-on-error: true

    - name: Send reminder to local endpoint (fallback)
      if: failure()
      run: |
        curl -X POST 'http://localhost:3000/api/cron/test'
