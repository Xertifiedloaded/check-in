name: Reminder Cron Job

on:
  schedule:
 - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    
    steps:
      - name: Send reminder to production endpoint
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST 'https://daily-check-in.com.ng/api/cron/test')
          status_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          
          echo "Status code: $status_code"
          echo "Response body: $body"
          
          if [ "$status_code" -ge 200 ] && [ "$status_code" -lt 300 ]; then
            echo "Request successful"
          else
            echo "Request failed with status code $status_code"
            exit 1
          fi
        continue-on-error: true
      
      - name: Debug Cron Trigger
        run: |
          echo "Workflow triggered at: $(date)"
          echo "Last cron run: $(date --date='1 minute ago')"